<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pazzle Apps</title>

  <meta
    name="description"
    content="Pazzle Appsは、シンプルで奥深いロジックパズルゲームを開発しています。"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="hero">
    <div class="container">

      <p class="eyebrow">Puzzle Game Developer</p>

      <h1>Pazzle Apps</h1>

      <p class="lead">
        Think. Discover. Solve.<br>
        シンプルだけど奥深い、ロジックパズルゲームを開発しています。
      </p>

    </div>
  </header>


  <main class="container">

    <section class="section">

      <h2>Games</h2>

      <div class="app-grid">

        <article class="app-card">

          <div class="app-header">

            <img
              src="./images/areanest-icon.png"
              alt="AreaNest"
              class="app-icon"
            >

            <div>
              <h3>AreaNest</h3>
              <p class="tagline">
                Shikaku × Gimmicks
              </p>
            </div>

          </div>

          <p class="app-description">
            数字が示す面積になるように盤面を長方形に分けていく
            ロジックパズルに、さまざまなギミックを追加。
            シンプルなルールから生まれる、
            ひとクセある問題を楽しめます。
          </p>

          <div class="app-links">

            <a
              class="button primary"
              href="https://apps.apple.com/us/app/areanest/id6801860560"
              target="_blank"
              rel="noopener noreferrer"
            >
              App Store
            </a>

            <a
              class="button secondary"
              href="./PrivacyPolicy_AreaNest.html"
            >
              Privacy Policy
            </a>

          </div>

        </article>

      </div>

    </section>

  </main>


  <footer class="footer">

    <div class="container">
      <p>© 2026 Pazzle Apps. All rights reserved.</p>
    </div>

  </footer>

</body>
</html>
